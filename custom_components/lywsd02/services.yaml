set_time:
  description: Set time on a LYWSD02
  fields:
    mac:
      description: BLE MAC Address of a LYWSD02
      example: "01:23:45:67:89:AB"
      required: true
    timestamp:
      description: UNIX Epoch Value Representing Desired Time
      example: 1702200346
    tz_offset:
      description: Timezone Offset in Hours
      example: -3
    temp_mode:
      description: C = Celsius, F = Fahrenheit
      example: "C"
    clock_mode:
      description: 12 or 24 hour operation
      example: 12
    display:
      description: 4 digits HHMM to show instead of the current time (HH 00-23, MM 00-59). Always quote the value. The clock keeps counting from there until the next sync.
      example: "1234"
    timeout:
      description: How long to wait for connection with LYWSD02 - increase if update is failing
      example: 10
